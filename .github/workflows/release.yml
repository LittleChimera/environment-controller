name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Changelog
        run: make changelog-current

      - name: Build Kustomize Manifests
        run: |
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/}
          # Build installer with version tag
          make build-installer IMG=ghcr.io/${{ github.repository }}:${VERSION}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG-current.md
          # A tag with a pre-release suffix (v0.2.0-rc.0, v1.0.0-beta.2) must
          # not be published as a normal release: GitHub would show it as
          # "Latest" and anyone following the repo's releases would take a
          # release candidate for the stable one. SemVer puts that suffix
          # after a hyphen, and a plain release tag never contains one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/install.yaml
